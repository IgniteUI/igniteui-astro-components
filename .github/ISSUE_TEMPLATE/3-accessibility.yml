name: ♿ Accessibility issue
description: A WCAG, keyboard, screen reader, contrast or motion problem in a component or style.
title: '[A11y]: '
labels: [':wheelchair: a11y', ':bug: bug']
body:
  - type: input
    id: component
    attributes:
      label: Component or page
      placeholder: CopyCode button on pre.astro-code
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      multiple: true
      options:
        - Colour contrast
        - Keyboard navigation / focus
        - Screen reader (names, roles, announcements)
        - Touch / pointer target size
        - Motion / animation
        - Structure (headings, landmarks, tables)
        - Other
    validations:
      required: true

  - type: input
    id: criterion
    attributes:
      label: WCAG success criterion
      description: If you know it, e.g. `1.4.3 Contrast (Minimum)` or `2.4.7 Focus Visible`.
      placeholder: 1.4.3 Contrast (Minimum)

  - type: textarea
    id: description
    attributes:
      label: What is wrong and who does it affect?
      description: Include measured values where possible (contrast ratio, target size) and the tool you used (axe, Lighthouse, VoiceOver, NVDA…).
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open http://localhost:4567/components/code-block/ in the light theme
        2. Tab from a code block to its copy button
        3. …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, assistive technology and version, page theme.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
