<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" font-family="system-ui, sans-serif" role="img" aria-label="Button anatomy diagram">
  <!-- The component being annotated -->
  <rect x="220" y="96" width="200" height="56" rx="8" fill="#0d6efd"/>
  <circle cx="252" cy="124" r="9" fill="#ffffff"/>
  <text x="320" y="130" fill="#ffffff" font-size="16" text-anchor="middle">Save changes</text>
  <circle cx="388" cy="124" r="9" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Callout: prefix icon -->
  <line x1="252" y1="124" x2="252" y2="52" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="252" cy="52" r="3" fill="#8a8a8a"/>
  <text x="252" y="40" fill="#4a4a4a" font-size="13" text-anchor="middle">Prefix icon</text>

  <!-- Callout: label -->
  <line x1="320" y1="124" x2="320" y2="208" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="320" cy="124" r="3" fill="#8a8a8a"/>
  <text x="320" y="228" fill="#4a4a4a" font-size="13" text-anchor="middle">Label</text>

  <!-- Callout: suffix icon -->
  <line x1="388" y1="124" x2="388" y2="52" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="388" cy="52" r="3" fill="#8a8a8a"/>
  <text x="388" y="40" fill="#4a4a4a" font-size="13" text-anchor="middle">Suffix icon</text>

  <!-- Callout: container -->
  <line x1="420" y1="124" x2="520" y2="124" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="420" cy="124" r="3" fill="#8a8a8a"/>
  <text x="528" y="128" fill="#4a4a4a" font-size="13">Container</text>
</svg>
